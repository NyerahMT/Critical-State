name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Create temporary non-debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/critical-state-release.jks" \
            -storepass criticalstateci \
            -keypass criticalstateci \
            -alias criticalstate \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=NyerahWorks Critical State, OU=Development, O=NyerahWorks, L=Canton, ST=Ohio, C=US"

      - name: Test and build release APK
        env:
          CS_KEYSTORE: ${{ runner.temp }}/critical-state-release.jks
          CS_STORE_PASSWORD: criticalstateci
          CS_KEY_ALIAS: criticalstate
          CS_KEY_PASSWORD: criticalstateci
        run: gradle :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Critical-State-GMee-release-test
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
